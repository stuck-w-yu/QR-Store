services:
  postgres:
    image: postgres:16-alpine
    container_name: qr_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: qr_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qr_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qr_store_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/qr_store?sslmode=disable
      JWT_SECRET: production-secret-jwt-key-change-this-in-env-file-999
      PAYMENT_PROVIDER: mock
      CORS_ORIGINS: "*"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qr_store_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PUBLIC_API_URL: http://localhost:8080/api/v1
      PUBLIC_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"

volumes:
  pgdata:
